server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The panel is a Vite build: /assets/* filenames are content-hashed, so they are
  # immutable and safe to cache forever. index.html is NOT hashed — it points at the
  # current asset hashes and must be revalidated every load, or a browser keeps loading
  # an old bundle after a deploy (the "my media-panel redesign isn't showing up" bug).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  # SPA fallback: unknown routes serve the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
