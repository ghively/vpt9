<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPT render client</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0c11; height: 100%; overflow: hidden; }
  #stage { display: block; width: 100vw; height: 100vh; }
  #pip-root { position: fixed; inset: 0; pointer-events: none; }
  .pip-window {
    position: absolute;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .pip-window iframe { width: 100%; height: 100%; border: 0; display: block; }
  #status {
    position: fixed; left: 10px; bottom: 8px;
    font: 11px ui-monospace, "SF Mono", Consolas, monospace;
    color: rgba(231, 233, 239, 0.55);
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="pip-root"></div>
  <div id="status">connecting…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
