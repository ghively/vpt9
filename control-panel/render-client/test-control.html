<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phase 1 test harness — not the real control panel</title>
<style>
  body {
    background: #0a0c11; color: #e7e9ef;
    font: 13px -apple-system, "Segoe UI", sans-serif;
    padding: 32px; max-width: 420px;
  }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p { color: #838ba0; font-size: 12px; margin: 0 0 24px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #838ba0; margin-bottom: 6px; }
  .field { margin-bottom: 20px; }
  input[type="range"] { width: 100%; }
  input[type="text"] { width: 100%; box-sizing: border-box; background: #1c212c; border: 1px solid #2a303d; color: #e7e9ef; padding: 8px; border-radius: 4px; }
  #val { font-family: ui-monospace, monospace; }
  #status { font-size: 11px; color: #838ba0; margin-top: 24px; }
</style>
</head>
<body>
  <h1>Phase 1 test harness</h1>
  <p>Sends raw state updates over the control-plane WebSocket. This is a bare debug tool for verifying the pipeline — not the designed control panel.</p>

  <div class="field">
    <label>Opacity — <span id="val">100%</span></label>
    <input type="range" id="opacity" min="0" max="1" step="0.01" value="1">
  </div>

  <div class="field">
    <label>Source URL</label>
    <input type="text" id="sourceUrl" placeholder="/media/sample.mp4" value="/media/sample.mp4">
  </div>

  <div id="status">connecting…</div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const layerId = params.get("layer") || "layer-1";
    const wsUrl = params.get("ws") || `ws://${location.hostname}:8080`;

    const socket = new WebSocket(wsUrl);
    const statusEl = document.getElementById("status");
    socket.addEventListener("open", () => (statusEl.textContent = `connected · ${wsUrl}`));
    socket.addEventListener("close", () => (statusEl.textContent = "disconnected"));
    socket.addEventListener("error", () => (statusEl.textContent = "error"));

    function send(path, value) {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "update", path, value }));
      }
    }

    const opacityEl = document.getElementById("opacity");
    const valEl = document.getElementById("val");
    opacityEl.addEventListener("input", () => {
      const value = Number(opacityEl.value);
      valEl.textContent = `${Math.round(value * 100)}%`;
      send(`layers.${layerId}.opacity`, value);
    });

    const sourceEl = document.getElementById("sourceUrl");
    sourceEl.addEventListener("change", () => {
      send(`layers.${layerId}.source.url`, sourceEl.value);
    });
  </script>
</body>
</html>
