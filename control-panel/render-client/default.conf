server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The render client is served as raw, UNHASHED ES modules (src/*.js) plus index.html —
  # there is no bundler/content-hash step (see Dockerfile). Under stock nginx caching a
  # browser heuristically holds these files and keeps running an OLD module graph after a
  # deploy, which shows up as "the projector still runs the old/frozen behaviour after an
  # update" (and, worse, a stale+fresh module MIX that throws and renders nothing).
  #
  # `no-cache` does NOT disable caching — it tells the browser it may cache but MUST
  # revalidate via ETag before use. nginx answers those with a cheap 304 when a file is
  # unchanged and full content the moment it changes, so every load runs a consistent,
  # current module set with almost no extra bandwidth.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
